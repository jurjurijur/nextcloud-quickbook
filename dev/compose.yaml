# Quick Booking development environment
#   Nextcloud 34.0.5 (same as production) + Calendar app + Mailpit (catches all email)
#   Nextcloud: http://localhost:8080   (admin / password in dev/.env)
#   Ports are bound to 127.0.0.1 only: not reachable from the network.
#   Mailpit:   http://localhost:8025
name: quickbook-dev

services:
  nextcloud:
    image: nextcloud:34.0.5-apache
    ports:
      - "127.0.0.1:8080:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${QB_ADMIN_PASSWORD:?run ./setup.sh first}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: ""
      MAIL_FROM_ADDRESS: nextcloud
      MAIL_DOMAIN: example.test
    volumes:
      - nextcloud:/var/www/html
      - ../quickbook:/var/www/html/custom_apps/quickbook:ro
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  nextcloud:
